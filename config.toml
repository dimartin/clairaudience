# clairaudience configuration. Pick a profile with --profile or CLAIRAUDIENCE_PROFILE.
# Machine-specific settings go in config.local.toml (git-ignored), which is merged on top.
default_profile = "16gb"

[llm]
temperature = 0.2
max_tokens = 8192       # attribution of a dialogue-heavy chapter can need this many
cast_max_tokens = 4096  # the cast pass answers in under ~2,000; a runaway stops here
repetition_penalty = 1.1  # in-process (mlx) models only
timeout_s = 600
retries = 6
min_lines = 5          # characters with fewer spoken lines share the extras' voices
structured_output = false  # true if llm_base_url's server takes a JSON schema in response_format
# A nameless dialogue tag ("said she") is read twice: once by llm_model and once by
# tag_check_model if a profile sets one, else by llm_model with another seed.
# With the mlx backend both models stay loaded in the attribute process.

# A 16 GB Apple Silicon Mac. Every model runs in-process, one at a time.
# All models here are Apache-2.0 licensed.
[profiles."16gb"]
llm_backend = "mlx"
llm_model = "mlx-community/Qwen3.5-9B-MLX-4bit"
design_model = "mlx-community/Qwen3-TTS-12Hz-1.7B-VoiceDesign-bf16"
tts = "voxcpm2"
tts_model = "mlx-community/VoxCPM2-bf16"
# tag_check_model = "mlx-community/Qwen3.5-4B-4bit"   # second reader for nameless tags (memory untested)

# Fastest: a 4B for the text stages (faster, less accurate) and 4-bit Chatterbox Turbo,
# which rendered about 4x faster than VoxCPM2 on an M1 Pro (RTF 0.47 vs 2.04, 2026-10-06).
# It replaced a 4-bit Higgs build that mlx-audio can't load. Apache-2.0 / MIT.
[profiles."16gb-small"]
llm_backend = "mlx"
llm_model = "mlx-community/Qwen3.5-4B-4bit"
design_model = "mlx-community/Qwen3-TTS-12Hz-1.7B-VoiceDesign-bf16"
tts = "chatterbox"
tts_model = "mlx-community/chatterbox-turbo-4bit"

# 24 GB or more: full-precision Higgs TTS 3 (research / non-commercial licence).
[profiles."24gb"]
llm_backend = "mlx"
llm_model = "mlx-community/Qwen3.5-9B-MLX-4bit"
design_model = "mlx-community/Qwen3-TTS-12Hz-1.7B-VoiceDesign-bf16"
tts = "higgs"
tts_model = "bosonai/higgs-tts-3-4b"

[publish]
# rsync destination for the finished book folder (an Audiobookshelf library root, say).
# Empty means encode only. Override in config.local.toml.
dest = ""
format = "m4a"          # m4a (per chapter), mp3 (per chapter), or m4b (one file with chapters)
bitrate = "96k"
label = "Full Cast"     # album name is "<Title> (<label>)"

[qc]
# qc.py: a clip fails a metric over max(floor, k x its voice's median for that metric).
asr_model = "small.en"  # faster-whisper, as names.py uses
cer_floor = 0.15        # character error rate of the transcript
cer_k = 3.0
wrong_run_floor = 3     # longest run of wrong words
wrong_run_k = 3.0
extra_floor = 2         # words heard before or after the line
extra_k = 3.0
pitch_floor = 4.0       # semitones from the voice's reference clip
pitch_k = 3.0
length_floor = 0.5      # |ln(seconds per char / the voice's median)|; 0.5 is about 1.65x
length_k = 3.0
min_missing_letters = 5 # shorter missing words are ignored: the recognizer drops them in good audio too
window_pad = 0.6        # seconds either side of a missing word for the second listen
retakes = 3             # new takes for a flagged line
short_chars = 80        # a flagged line this short gets short_takes takes, keeping the closest pitch among passing takes
short_takes = 8
